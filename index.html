<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Cuentas Claras</title>
    
    <meta name="theme-color" content="#bb86fc">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" href="data:,"> <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Evitar parpadeo de tema
        const savedTheme = localStorage.getItem('app-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <button id="theme-toggle" class="theme-toggle" style="position: fixed; top: 15px; right: 15px; z-index: 1000; background: none; border: none; cursor: pointer;">
        <span class="material-icons">light_mode</span>
    </button>

    <main class="main-content">
        <div id="app">
            
            <section id="dashboard" class="page active">
                <div class="header"><h1>Resumen</h1></div>

                <div class="balance-container">
                    <div class="balance-card total">
                        <p>Balance Total</p>
                        <h2 id="total-balance">$ 0,00</h2>
                    </div>
                    <div class="balance-card income">
                        <p>Ingresos</p>
                        <h2 id="total-income">$ 0,00</h2>
                    </div>
                    <div class="balance-card expense">
                        <p>Gastos</p>
                        <h2 id="total-expense">$ 0,00</h2>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <h3>Gastos por Categoría</h3>
                        <div style="position: relative; height: 250px;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Movimientos Recientes</h3>
                        <div id="recent-list" class="transaction-list">
                            </div>
                    </div>
                </div>
            </section>

            <section id="transactions" class="page">
                <div class="header"><h1>Añadir Movimiento</h1></div>
                <div class="card">
                    <form id="transaction-form">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px;">Concepto</label>
                            <input type="text" name="name" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:var(--background-color); color:white;" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px;">Monto</label>
                            <input type="number" name="amount" step="0.01" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:var(--background-color); color:white;" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display:block; margin-bottom:5px;">Tipo</label>
                            <select name="type" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:var(--background-color); color:white;">
                                <option value="egreso">Gasto</option>
                                <option value="ingreso">Ingreso</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label style="display:block; margin-bottom:5px;">Categoría</label>
                            <select name="category" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:var(--background-color); color:white;">
                                <option value="Comida">Comida</option>
                                <option value="Local">Local</option>
                                <option value="Ventas">Ventas</option>
                                <option value="Repuestos">Repuestos</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary">Guardar Movimiento</button>
                    </form>
                </div>
            </section>

            <section id="calendar" class="page">
                <div class="header"><h1>Calendario</h1></div>
                <div id="calendar-container" class="card"></div>
                <div id="day-detail"></div>
            </section>

            <section id="settings" class="page">
                <div class="header"><h1>Guardado</h1></div>
                <div class="card">
                    <h3>Copia de Seguridad</h3>
                    <p style="font-size: 13px; opacity: 0.7; margin: 10px 0 20px;">Gestiona tus datos exportando o importando archivos JSON.</p>
                    <button class="btn-primary" onclick="backupSystem.exportToJSON()" style="margin-bottom: 10px;">
                        <i class="material-icons" style="vertical-align: middle; font-size: 18px;">download</i> Exportar Datos
                    </button>
                    <input 
  type="file" 
  id="importFile" 
  accept=".json,application/json" 
  onchange="backupSystem.importFromJSON(this.files[0])" 
  style="display:none"
>
                    <button class="btn-primary" style="background:transparent; border:1px solid var(--primary-color); color:var(--primary-color);" onclick="document.getElementById('importFile').click()">
                        <i class="material-icons" style="vertical-align: middle; font-size: 18px;">upload</i> Importar Datos
                    </button>
                </div>
            </section>
        </div>
    </main>

    <nav class="navbar">
        <div class="nav-container">
            <button class="nav-btn active" data-page="dashboard">
                <i class="material-icons">dashboard</i>
                <span>Inicio</span>
            </button>
            <button class="nav-btn" data-page="transactions">
                <i class="material-icons">add_circle</i>
                <span>Añadir</span>
            </button>
            <button class="nav-btn" data-page="calendar">
                <i class="material-icons">calendar_month</i>
                <span>Calendario</span>
            </button>
            <button class="nav-btn" data-page="settings">
                <i class="material-icons">save</i>
                <span>Guardado</span>
            </button>
        </div>
    </nav>

    <div id="notification" class="notification"></div>

    <script src="database.js"></script>
    <script src="ui.js"></script>
    <script src="calendar.js"></script>
    <script src="backup-system.js"></script>
    <script src="sw-registration.js"></script>
    <script src="app.js"></script>
</body>
</html>
