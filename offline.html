<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas Claras - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            /* Fondo oscuro coherente con tu app */
            background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 450px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .offline-icon {
            margin-bottom: 24px;
            /* Usamos tu color primario violeta */
            color: #bb86fc;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(187, 134, 252, 0.3));
        }
        
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        p {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }
        
        .btn-primary {
            background: #bb86fc;
            color: #000;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(187, 134, 252, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Lista de funciones offline */
        .feature-list {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 16px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .feature-item i { color: #81c784; font-style: normal; font-weight: bold; }

        @media (max-width: 480px) {
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        
        <h1>Modo Offline</h1>
        
        <p>
            No tienes conexión a internet, pero <strong>Cuentas Claras</strong> sigue funcionando. 
            Puedes seguir gestionando tus finanzas localmente.
        </p>
        
        <div class="actions">
            <button class="btn-primary" onclick="window.location.reload()">
                Reintentar conexión
            </button>
            <button class="btn-secondary" onclick="checkConnection()">
                Verificar estado
            </button>
        </div>
        
        <div class="feature-list">
            <div class="feature-item"><i>✓</i> Ver transacciones y balances</div>
            <div class="feature-item"><i>✓</i> Añadir nuevos gastos/ingresos</div>
            <div class="feature-item"><i>✓</i> Usar el calendario y gráficos</div>
        </div>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                alert('Aún no tienes conexión. Verifica tus datos o Wi-Fi.');
            }
        }

        // Si la conexión vuelve sola, recarga inmediatamente
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
